name: Central Security Alerts Dispatch

on:
  repository_dispatch:
    types: [security_alert_updated, code_scanning_alert]

jobs:
  dispatch-pr-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: List Open Pull Requests
        id: list_prs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching open PRs..."
          curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open" > prs.json
          cat prs.json
          
          # Parse out all PR numbers (separated by spaces)
          pr_numbers=$(jq -r '.[].number' prs.json | tr '\n' ' ')
          echo "Found PRs: $pr_numbers"
          echo "::set-output name=pr_numbers::$pr_numbers"

      - name: Trigger Subaction Workflows on PR Branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_numbers="${{ steps.list_prs.outputs.pr_numbers }}"
          echo "Processing PRs: $pr_numbers"
          
          # Loop through each PR number
          for pr in $pr_numbers; do
            echo "Processing PR #$pr"
            
            # Get the branch name associated with the PR
            branch=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/$pr" | jq -r '.head.ref')
            echo "PR branch: $branch"
            
            # Fetch security alerts for the PR
            ALERTS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?pr=$pr")
            
            # Process alerts with jq
            UNRESOLVED_ALERTS=$(echo "$ALERTS" | jq -c '[.[] | select(.state == "open")]' || echo "[]")
            DISMISSED_ALERTS=$(echo "$ALERTS" | jq -c '[.[] | select(.state == "dismissed" and (.dismissed_comment == null or .dismissed_comment == ""))]' || echo "[]")
            UNRESOLVED_COUNT=$(echo "$UNRESOLVED_ALERTS" | jq -r 'length')
            DISMISSED_COUNT=$(echo "$DISMISSED_ALERTS" | jq -r 'length')
            
            echo "PR #$pr: Unresolved count: $UNRESOLVED_COUNT, Dismissed count: $DISMISSED_COUNT"
            
            payload=$(jq -n \
              --arg ref "$branch" \
              --arg pr_number "$pr" \
              --arg unresolved_alerts "$UNRESOLVED_ALERTS" \
              --arg dismissed_alerts "$DISMISSED_ALERTS" \
              --arg unresolved_count "$UNRESOLVED_COUNT" \
              --arg dismissed_count "$DISMISSED_COUNT" \
              '{
                ref: $ref,
                inputs: {
                  pr_number: $pr_number,
                  unresolved_alerts: $unresolved_alerts,
                  dismissed_alerts: $dismissed_alerts,
                  unresolved_count: $unresolved_count,
                  dismissed_count: $dismissed_count
                }
              }')
            
            echo "Payload: $payload"
            
            response=$(curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/securityAlertsReview.yml/dispatches" \
              -d "$payload")
            echo "Triggered subaction for PR #$pr on branch $branch: $response"
          done
