name: Olympix Integrated Security Workflow

on:
  pull_request:
    types:
      - ready_for_review
    paths:
      - '**/*.sol'
      - '.github/workflows/olympixStaticAnalysis.yml'

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with: 
          files: |
            **/*.sol

      - name: Convert Changed Files to Args
        if: steps.changed-files.outputs.any_changed == 'true'
        id: format-args
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          args=$(echo $ALL_CHANGED_FILES | xargs -n 1 -I {} printf -- "-p %s " "{}")
          echo "ARGS=$args" >> $GITHUB_ENV

      - name: Run Olympix Integrated Security
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: olympix/integrated-security@main
        env:
          OLYMPIX_API_TOKEN: ${{ secrets.OLYMPIX_API_TOKEN }}
        with:
          args: --output-format sarif --output-path ./ ${{ env.ARGS }}

      - name: Upload Result to GitHub Code Scanning
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: olympix.sarif

  enforce-dismiss-comment:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Check Dismissed Security Alerts
        run: |
          ALERTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=dismissed")
          
          MISSING_COMMENTS=$(echo $ALERTS | jq '[.[] | select(.dismissed_by != null and .dismissed_comment == null)] | length')

          if [ "$MISSING_COMMENTS" -gt 0 ]; then
            echo "Some security alerts were dismissed without comments! Please provide a reason before dismissing."
            exit 1
          else
            echo "All dismissed alerts have comments. ✅"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
