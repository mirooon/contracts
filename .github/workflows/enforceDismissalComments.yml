name: Enforce Dismissal Comments on Security Alerts

on:
  push:
    paths:
      - "**/*.sol"
      - ".github/workflows/enforceDismissalComments.yml"
  issue_comment:
    types:
      - created
      - edited
  pull_request:
    types:
      - ready_for_review
  workflow_dispatch:  # ✅ Allows manual re-run from GitHub UI

jobs:
  check-dismissed-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch PR Number
        id: fetch_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open" | jq -r '.[0].number')

          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No open PR found, skipping check."
            exit 0
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR number: $PR_NUMBER"

      - name: Fetch Changed Files in PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching changed files in PR #${PR_NUMBER}..."
          
          # Fetch list of changed files and format them as a JSON array
          CHANGED_FILES=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" | jq -c '[.[].filename]')

          echo "Changed Files JSON Array: $CHANGED_FILES"

          # Save it correctly as a single-line JSON array
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV

      - name: Fetch Dismissed Security Alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching dismissed security alerts..."

          ALERTS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=dismissed")

          echo "Raw API Response:"
          echo "$ALERTS"

          # Ensure CHANGED_FILES is properly read as JSON
          CHANGED_FILES_JSON=$(echo "$CHANGED_FILES" | jq -c .)

          echo "CHANGED_FILES_JSON: $CHANGED_FILES_JSON"

          # Filter alerts to match changed files
          FILTERED_ALERTS=$(echo "$ALERTS" | jq --argjson files "$CHANGED_FILES_JSON" '
            [ .[] | select(.dismissed_by != null and (.dismissed_comment == null or .dismissed_comment == ""))
              | select(.most_recent_instance.location.path as $path | index($files[])) ]')

          if [[ -z "$FILTERED_ALERTS" || "$FILTERED_ALERTS" == "[]" ]]; then
            echo "✅ No relevant dismissed alerts found."
            FILTERED_ALERTS_COUNT=0
          else
            FILTERED_ALERTS_COUNT=$(echo "$FILTERED_ALERTS" | jq -r 'length')
          fi

          echo "FILTERED_ALERTS_COUNT=$FILTERED_ALERTS_COUNT" >> $GITHUB_ENV
          echo "FILTERED_ALERTS<<EOF" >> $GITHUB_ENV
          echo "$FILTERED_ALERTS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV


      - name: Find Existing PR Comment
        id: find_comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Searching for existing PR comment..."
          
          COMMENT_ID=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" | jq -r \
            '.[] | select(.body | startswith("### 🤖 GitHub Action: Enforce Dismissal Comments")) | .id')

          if [[ -n "$COMMENT_ID" && "$COMMENT_ID" != "null" ]]; then
            echo "EXISTING_COMMENT_ID=$COMMENT_ID" >> $GITHUB_ENV
          fi

          echo "Found comment ID: $COMMENT_ID"

      - name: Post or Update PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$FILTERED_ALERTS_COUNT" -gt 0 ]]; then
            COMMENT_BODY="### 🤖 GitHub Action: Enforce Dismissal Comments ❌\n\n"
            COMMENT_BODY+="🚨 **Some security alerts related to this PR were dismissed without comments!**\n\n"
            COMMENT_BODY+="The following security alerts were dismissed **without a comment**:\n"

            echo "$FILTERED_ALERTS" | jq -c '.[]' | while read -r alert; do
              ALERT_URL=$(echo "$alert" | jq -r '.html_url')
              ALERT_FILE=$(echo "$alert" | jq -r '.most_recent_instance.location.filePath')
              COMMENT_BODY+="🔹 [View Alert]($ALERT_URL) - **File:** \`$ALERT_FILE\`\n"
            done

            COMMENT_BODY+="\n⚠️ **Please provide a reason before dismissing security alerts.**"

            # Update existing comment if found
            if [[ -n "$EXISTING_COMMENT_ID" ]]; then
              echo "Updating existing comment ID: $EXISTING_COMMENT_ID"
              curl -s -X PATCH -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"body\": \"$COMMENT_BODY\"}" \
                "https://api.github.com/repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}"
            else
              echo "Posting new comment to PR..."
              curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"body\": \"$COMMENT_BODY\"}" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments"
            fi
          else
            if [[ -n "$EXISTING_COMMENT_ID" ]]; then
              echo "All relevant alerts now have comments. Updating status to ✅."
              COMMENT_BODY="### 🤖 GitHub Action: Enforce Dismissal Comments ✅\n\n"
              COMMENT_BODY+="✅ **All security alerts related to this PR now have comments!**\n\n"
              COMMENT_BODY+="🛡️ Your repository is compliant with security best practices. Keep up the good work! 🎉"

              curl -s -X PATCH -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"body\": \"$COMMENT_BODY\"}" \
                "https://api.github.com/repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}"
            fi
          fi
