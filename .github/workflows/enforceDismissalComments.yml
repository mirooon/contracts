---
name: Enforce Dismissal Comments on Security Alerts
on:
  push:
    paths:
      - "**/*.sol"
      - .github/workflows/enforceDismissalComments.yml
  issue_comment:
    types:
      - created
      - edited
  pull_request:
    types:
      - ready_for_review
jobs:
  check-dismissed-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dismissed Security Alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          echo "Fetching dismissed security alerts..."


          # Fetch dismissed alerts using GitHub API

          ALERTS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=dismissed")

          # Log API response for debugging

          echo "Raw API Response:"

          echo "$ALERTS"


          # Check if any dismissed alert is missing a comment

          MISSING_COMMENTS=$(echo "$ALERTS" | jq '[.[] | select(.dismissed_by != null and (.dismissed_comment == null or .dismissed_comment == ""))] | length')


          if [ "$MISSING_COMMENTS" -gt 0 ]; then
            echo "❌ Some security alerts were dismissed without comments! Please provide a reason before dismissing."
            exit 1
          else
            echo "✅ All dismissed alerts have comments."
          fi
