---
name: Enforce Dismissal Comments on Security Alerts
on:
  push:
    paths:
      - "**/*.sol"
      - .github/workflows/enforceDismissalComments.yml
  issue_comment:
    types:
      - created
      - edited
  pull_request:
    types:
      - ready_for_review
  workflow_dispatch: null
jobs:
  check-dismissed-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dismissed Security Alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          echo "Fetching dismissed security alerts..."


          # Fetch dismissed alerts using GitHub API

          ALERTS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=dismissed")

          # Log API response for debugging

          echo "Raw API Response:"

          echo "$ALERTS"


          # Check if any dismissed alert is missing a comment

          MISSING_ALERTS=$(echo "$ALERTS" | jq -r '.[] | select(.dismissed_by != null and (.dismissed_comment == null or .dismissed_comment == "")) | .number')


          if [[ -n "$MISSING_ALERTS" ]]; then
            echo "❌ Some security alerts were dismissed without comments! Please provide a reason before dismissing."
            exit 1
          else
            echo "✅ All dismissed alerts have comments."
          fi
      - name: Post Dismissal Comments to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          echo "Posting dismissal comments to the PR..."


          # Get PR number

          PR_NUMBER=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open" | jq -r '.[0].number')

          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No open PR found, skipping comment posting."
            exit 0
          fi


          # Loop through dismissed alerts and post each comment

          echo "$ALERTS" | jq -c '.[] | select(.dismissed_by != null and .dismissed_comment != null and .dismissed_comment != "")' | while read -r alert; do
            COMMENT=$(echo "$alert" | jq -r '.dismissed_comment')
            ALERT_URL=$(echo "$alert" | jq -r '.html_url')

            echo "Posting comment for dismissed alert: $ALERT_URL"

            curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"body\": \"🛑 **Security Alert Dismissed**\n\nDismissal Reason: $COMMENT\n[View Alert]($ALERT_URL)\"}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments"
          done
